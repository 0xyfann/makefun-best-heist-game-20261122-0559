<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Meridian Vault — a heist game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f18; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #0b0f18; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="The Meridian Vault: a top-down heist game. Move the thief with WASD or arrow keys, use tools with keys 1, 2 and 3, avoid guard vision cones and cameras, steal the Meridian Diamond and reach the green exit."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
